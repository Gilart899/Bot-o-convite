<!DOCTYPE html>
<html lang="pt-BR">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Convite Especial</title>


<!-- CSS PRINCIPAL -->
<link rel="stylesheet" href="css/style.css">


<!-- CSS DAS ANIMAÇÕES -->
<link rel="stylesheet" href="css/animacoes.css">


</head>


<body>


<!-- FUNDO DECORATIVO -->

<div class="fundo">


    <div class="rosa">🌹</div>

    <div class="rosa">🌹</div>

    <div class="rosa">🌹</div>


</div>




<!-- CARTÃO PRINCIPAL -->

<main class="cartao">


    <header>

        <h1>
            Você está convidado
        </h1>


        <p>
            Para um momento muito especial
        </p>


    </header>





    <!-- IMAGEM PRINCIPAL -->

    <img 
    src="img/foto-evento.jpg"
    alt="Imagem do convite"
    class="imagem-convite">





    <!-- TEXTO DO CONVITE -->

    <section class="mensagem">


        <h2>
            Uma celebração inesquecível
        </h2>


        <p>

            Será uma alegria ter você conosco
            neste dia especial.

        </p>


    </section>






    <!-- CONTAGEM REGRESSIVA -->


    <section class="tempo">


        <h3>
            Falta pouco!
        </h3>


        <div 
        id="contador">
            Carregando...
        </div>


        <div 
        id="dataEvento"
        data-data="2026-12-31T19:00:00">
        </div>


    </section>







    <!-- LOCAL -->


    <section class="local">


        <h3>
            📍 Local
        </h3>


        <p>
            Endereço do evento
        </p>


    </section>







    <!-- PIX -->


    <section class="pix">


        <h3>
            🌹 Presente via Pix
        </h3>


        <p>
            Chave Pix:
        </p>


        <strong id="chavePix">

            coloque-sua-chave-pix

        </strong>



        <button id="copiarPix">

            📋 Copiar chave Pix

        </button>



        <div id="mensagemPix">

        </div>


    </section>







    <!-- VELAS -->

    <div class="velas">


        <span class="vela">
            🕯️
        </span>


        <span class="vela">
            🕯️
        </span>


        <span class="vela">
            🕯️
        </span>


    </div>







    <!-- CONFIRMAR PRESENÇA -->


    <a 
    class="whatsapp"
    href="#"
    target="_blank">

        💬 Confirmar presença

    </a>





</main>







<!-- MÚSICA OPCIONAL -->


<audio 
id="musica"
loop>

    <source 
    src="audio/musica.mp3"
    type="audio/mpeg">

</audio>







<!-- JAVASCRIPT -->

<script src="js/script.js"></script>


</body>

</html>
